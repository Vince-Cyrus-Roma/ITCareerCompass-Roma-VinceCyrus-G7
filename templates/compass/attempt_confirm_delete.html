{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h2 class="h4 text-danger mb-3">Delete Quiz Attempt</h2>
        <p>
          Delete your quiz attempt from
          <strong>{{ object.created_at|date:"M d, Y H:i" }}</strong>
          (top match: {{ object.top_career.name|default:"none" }})? This can't
          be undone.
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a
              href="{% url 'quiz_result' object.pk %}"
              class="btn btn-outline-secondary"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
