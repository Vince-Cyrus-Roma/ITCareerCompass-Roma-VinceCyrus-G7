{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h2 class="h4 text-danger mb-3">Delete Quiz Question</h2>
        <p>
          Are you sure you want to delete this question?
        </p>
        <blockquote class="blockquote bg-light p-3 rounded fs-6">
          {{ object.text }}
        </blockquote>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'admin_panel' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
