{% extends "base.html" %} {% block content %}
<h2 class="mb-4">Welcome, {{ user.first_name|default:user.username }}!</h2>
<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <div class="h4">{{ user.get_role_display }}</div>
        <div class="text-muted">Role</div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <div class="h4">{{ member_count }}</div>
        <div class="text-muted">Members</div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center shadow-sm">
      <div class="card-body">
        <div class="h4">{{ user.last_login|date:"M d, Y" }}</div>
        <div class="text-muted">Last login</div>
      </div>
    </div>
  </div>
</div>
{% if is_admin %}
<a class="btn btn-dark" href="{% url 'admin_panel' %}">Open admin panel</a>
{% endif %} {% endblock %}
